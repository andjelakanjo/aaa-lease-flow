<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAA Lease — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0e1a; --surface:rgba(255,255,255,0.06); --surface2:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.10);
  --accent:#4f8ef7; --text:#e8eaf0; --text-muted:#8890a4;
  --error:#f74f4f; --shadow:0 12px 40px rgba(0,0,0,0.6);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 50% at 15% 15%,rgba(79,142,247,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 85%,rgba(79,247,168,0.07) 0%,transparent 50%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;
  padding:40px 36px;
  width:100%;
  max-width:400px;
  box-shadow:0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
}
.logo{
  text-align:center;
  margin-bottom:28px;
}
.logo h1{
  font-family:'DM Serif Display',serif;
  font-size:1.8rem;
  letter-spacing:.02em;
}
.logo h1 span{color:var(--accent);text-shadow:0 0 20px rgba(79,142,247,0.5);}
.logo p{
  font-family:'DM Mono',monospace;
  font-size:.7rem;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.12em;
  margin-top:4px;
}
/* Tabs */
.tabs{
  display:flex;
  gap:4px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:4px;
  margin-bottom:24px;
}
.tab{
  flex:1;
  padding:8px 12px;
  background:none;
  border:none;
  border-radius:10px;
  color:var(--text-muted);
  font-family:'DM Sans',sans-serif;
  font-size:.82rem;
  font-weight:500;
  cursor:pointer;
  transition:all 0.2s ease;
}
.tab.active{
  background:rgba(79,142,247,0.18);
  color:#fff;
  box-shadow:0 0 14px rgba(79,142,247,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
/* Form elements */
.field{margin-bottom:16px;}
label{
  display:block;
  font-family:'DM Mono',monospace;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--text-muted);
  margin-bottom:7px;
}
input{
  width:100%;
  padding:11px 14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:10px;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:.9rem;
  outline:none;
  transition:all 0.2s ease;
}
input:focus{
  border-color:rgba(79,142,247,0.5);
  background:rgba(79,142,247,0.05);
  box-shadow:0 0 16px rgba(79,142,247,0.15);
}
.code-input{
  font-family:'DM Mono',monospace;
  font-size:1rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-align:center;
}
.code-hint{
  font-size:.75rem;
  color:var(--text-muted);
  text-align:center;
  margin-top:6px;
}
.btn{
  width:100%;
  padding:12px;
  background:rgba(79,142,247,0.2);
  color:#fff;
  border:1px solid rgba(79,142,247,0.4);
  border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-size:.92rem;
  font-weight:500;
  cursor:pointer;
  margin-top:8px;
  transition:all 0.2s ease;
  box-shadow:0 0 16px rgba(79,142,247,0.2);
}
.btn:hover{
  background:rgba(79,142,247,0.32);
  box-shadow:0 0 26px rgba(79,142,247,0.38);
  transform:translateY(-1px);
}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.error-msg{
  background:rgba(247,79,79,.08);
  border:1px solid rgba(247,79,79,.25);
  color:var(--error);
  border-radius:10px;
  padding:10px 14px;
  font-size:.82rem;
  margin-bottom:16px;
  display:none;
}
.error-msg.show{display:block;}
.hint-row{
  display:flex;
  justify-content:flex-end;
  margin-top:-8px;
  margin-bottom:12px;
}
.link-btn{
  background:none;
  border:none;
  color:rgba(255,255,255,0.75);
  font-size:.78rem;
  cursor:pointer;
  padding:0;
  text-decoration:underline;
}
.link-btn:hover{color:#fff;}
.info-msg{
  background:rgba(79,142,247,.08);
  border:1px solid rgba(79,142,247,.25);
  color:rgba(255,255,255,0.9);
  border-radius:10px;
  padding:10px 14px;
  font-size:.82rem;
  margin-bottom:16px;
  display:none;
}
.info-msg.show{display:block;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>AAA <span>Lease</span></h1>
    <p>Process Map — Internal Tool</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-email" type="button" data-tab="email">Email / Password</button>
    <button class="tab" id="tab-code" type="button" data-tab="code">Access Code</button>
  </div>

  <!-- Email/Password tab -->
  <div class="tab-panel active" id="panel-email">
    <div class="error-msg" id="err-email"></div>
    <div class="info-msg" id="forgot-ok">If an account exists for that email, we sent a password reset link.</div>
    <form id="form-email">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@aaalease.net">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <p style="font-size:.72rem;color:var(--text-muted);margin:-4px 0 8px;line-height:1.35;">
        For admin accounts (email login) only. Employees use the <strong>Access Code</strong> tab — no password.
      </p>
      <div class="hint-row">
        <button class="link-btn" type="button" id="btn-forgot">Forgot password?</button>
      </div>
      <button class="btn" type="submit" id="btn-email">Sign in →</button>
    </form>
  </div>

  <!-- Access Code tab -->
  <div class="tab-panel" id="panel-code">
    <div class="error-msg" id="err-code"></div>
    <form id="form-code">
      <div class="field">
        <label for="access-code">Access Code</label>
        <input class="code-input" type="text" id="access-code" name="access_code"
               autocomplete="off" required placeholder="AAA-XXXX-XXXX" maxlength="13">
        <p class="code-hint">Enter the code shared with you by your admin.</p>
      </div>
      <button class="btn" type="submit" id="btn-code">Enter →</button>
    </form>
  </div>
</div>

<script src="/login.js" defer></script>
</body>
</html>
